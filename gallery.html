    <!--
      HOW TO ADD YOUR OWN PHOTOS
      ───────────────────────────
      1. Drop image files into an assets/img/ folder.
      2. Copy one of the <figure> blocks below and update:
           src="assets/img/YOUR-FILE.jpg"
           alt="Brief description"
           <figcaption>Caption text</figcaption>
      3. The grid reflows automatically — no other changes needed.
    -->

    <div class="gallery-grid">

      <!-- Placeholder tiles that use a free image service -->
      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/lab1/400/400" alt="Lab bench" loading="lazy" />
